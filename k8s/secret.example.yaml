# Example only. Do NOT commit a real secret.
# Create the real secret imperatively instead so the value never lands in git:
#
#   kubectl create secret generic flask-health-api-secrets \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)"
#
# Or copy this file to secret.yaml, base64-encode your value, and apply it.
apiVersion: v1
kind: Secret
metadata:
  name: flask-health-api-secrets
type: Opaque
stringData:
  SECRET_KEY: replace-with-a-strong-random-secret
