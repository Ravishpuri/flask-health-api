name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: flask-health-api
  # Major/minor portion of the image version; patch is generated per build.
  MAJOR_MINOR: "0.0"

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run unit tests
        run: pytest -v

  security:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "0"          # report findings but do not fail the build
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [ test, security ]
    # Only push on direct pushes to main, never on pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full git history and tags so the version can be generated.
          fetch-depth: 0
      # Generate a unique image version per build:
      #   <major.minor>.<commit-count>.<short-sha>   e.g. 0.0.123.a1b2c3d
      - name: Calculate image version
        shell: bash
        run: |
          if git rev-parse "v${MAJOR_MINOR}" >/dev/null 2>&1; then
            BUILD=$(git rev-list --count "v${MAJOR_MINOR}..HEAD")
          else
            BUILD=$(git rev-list --count HEAD)
          fi
          PATCH=$(git rev-parse --short HEAD)
          IMAGE_VERSION="${MAJOR_MINOR}.${BUILD}.${PATCH}"
          echo "IMAGE_VERSION=${IMAGE_VERSION}" >> "$GITHUB_ENV"
          echo "Generated version: ${IMAGE_VERSION}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
