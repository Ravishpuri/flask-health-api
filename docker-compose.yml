services:
  api:
    build: .
    image: ravish24/flask-health-api:local
    container_name: flask-health-api
    ports:
      - "${HOST_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      # Port the app listens on inside the container (kept fixed at 5000).
      - PORT=5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
